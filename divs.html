<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div List Builder</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            background-color: DodgerBlue;
            gap: 10px;
            padding: 10px;
            flex-wrap: wrap;
        }
        .flex-container > div {
            background-color: #f1f1f1;
            padding: 20px;
            font-size: 30px;
        }
        .divlist {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>Yadeni builds list with divs</h1>

    <input type="text" id="inputText" placeholder="Enter item text">

    <button onclick="addEnd()">Add end</button>
    <button onclick="addFront()">Add front</button>
    <button onclick="removeEveryOther()">Remove</button>

    <div class="flex-container" id="targetContainer">
        <div class="divlist">First item</div>
        <div class="divlist">Second item</div>
        <div class="divlist">Third item</div>
    </div>

    <script>
        function addEnd() {
            let inputValue = document.getElementById("inputText").value;
            let newDiv = document.createElement("div");
            newDiv.innerHTML = inputValue;
            newDiv.className = "divlist";
            document.getElementById("targetContainer").appendChild(newDiv);
        }

        function addFront() {
            let inputValue = document.getElementById("inputText").value;
            let newDiv = document.createElement("div");
            newDiv.innerHTML = inputValue;
            newDiv.className = "divlist";
            
            let container = document.getElementById("targetContainer");
            container.insertBefore(newDiv, container.firstChild);
        }

        function removeEveryOther() {
            let divListItems = document.getElementsByClassName("divlist");
            let length = divListItems.length;

            if (length > 0) {
                for (let i = length - 1; i >= 0; i--) {
                    if (i % 2 === 0) { // removes indices 0, 2, 4, etc.
                        divListItems[i].remove();
                    }
                }
            }
        }
    </script>

</body>
</html>
