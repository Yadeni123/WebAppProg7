<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Timing Game</title>
</head>
<body>

    <h1>Yadeni reflexes</h1>

    <div id="target">Your time</div>
    <div id="countdown">Count</div>

    <button id="goButton">Go</button>
    <button id="haltButton">Halt</button>

    <script>
        let haltTime = undefined;

        function recordTime() {
            haltTime = Date.now();
            console.log(haltTime);
        }

        document.getElementById("haltButton").onclick = recordTime;

        function beginTime() {
            haltTime = undefined;
            document.getElementById("target").innerHTML = "Your time";

            let maxCount = Math.floor(Math.random() * 9) + 2;

            for (let i = 0; i <= maxCount; i++) {
                setTimeout(() => {
                    document.getElementById("countdown").innerHTML = i;
                }, (maxCount - i) * 1000);
            }

            setTimeout(() => {
                if (haltTime === undefined) {
                    document.getElementById("target").innerHTML = "Not soon enough";
                } else {
                    let targetTime = Date.now();
                    let elapsed = targetTime - haltTime;
                    document.getElementById("target").innerHTML = "Time was " + elapsed;
                }
            }, maxCount * 1000);
        }

        document.getElementById("goButton").onclick = beginTime;
    </script>

</body>
</html>
