<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Hunt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #gameGrid {
            display: grid;
            grid-template-columns: repeat(6, 70px);
            gap: 5px;
            justify-content: center;
            margin-top: 20px;
        }
        .grid-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
        }
    </style>
</head>
<body class="container my-4">

    <h1>Yadeni finds avians</h1>

    <p>Click on the locations to find the flowers, watch out for the poison ivy</p>
    
    <p id="locations">Number of locations checked is zero.</p>
    
    <p id="score">Score is zero.</p>
    
    <p id="helpButton" style="cursor: pointer; color: blue; text-decoration: underline;">Click for help.</p>
    
    <p id="help">Help report</p>

    <div id="gameGrid"></div>

    <script>
        const ids = [];
        const gridContainer = document.getElementById("gameGrid");

        for (let i = 0; i < 36; i++) {
            ids.push("img-" + i);
            
            let img = document.createElement("img");
            img.src = "tree.jpg";
            img.alt = "tree";
            img.id = "img-" + i;
            img.className = "grid-img";
            img.setAttribute("onclick", "check(" + i + ")");
            
            gridContainer.appendChild(img);
        }

        let score = 0;
        let locationsVisited = 0;
        let lastLocation = 0;
        let poisonLocation = 19;
        let roseLocation = 14;
        let lilyLocations = [3, 25];
        let daisyLocations = [2, 5, 11, 20, 21];
        let gameOver = false;

        function check(position) {
            if (gameOver) return;

            let imageElement = document.getElementById(ids[position]);

            if (position === poisonLocation) {
                imageElement.src = "poison ivy.jpg";
                gameOver = true;
                score -= 4;
            } else if (position === roseLocation) {
                imageElement.src = "rose.jpg";
                score += 4;
            } else if (lilyLocations.includes(position)) {
                imageElement.src = "lily.jpg";
                score += 2;
            } else if (daisyLocations.includes(position)) {
                imageElement.src = "daisy.jpg";
                score += 1;
            } else {
                imageElement.src = "tree.jpg";
            }

            imageElement.setAttribute("onclick", "");

            locationsVisited++;
            lastLocation = position;

            document.getElementById("locations").innerText = "Number of locations checked is " + locationsVisited + ".";
            document.getElementById("score").innerText = "Score is " + score + ".";
        }

        function help() {
            let row = Math.floor(lastLocation / 6);
            let col = lastLocation % 6;
            let result = "warm";

            let wrapNeighbors = [
                (lastLocation - 1 + 36) % 36,
                (lastLocation + 1) % 36,
                (lastLocation - 6 + 36) % 36,
                (lastLocation + 6) % 36
            ];

            let neighbors9 = [];
            for (let rOffset = -1; rOffset <= 1; rOffset++) {
                for (let cOffset = -1; cOffset <= 1; cOffset++) {
                    let nRow = row + rOffset;
                    let nCol = col + cOffset;
                    if (nRow >= 0 && nRow < 6 && nCol >= 0 && nCol < 6) {
                        neighbors9.push(nRow * 6 + nCol);
                    }
                }
            }

            if (wrapNeighbors.some(loc => daisyLocations.includes(loc))) {
                result = "cold";
            } else if (neighbors9.includes(roseLocation)) {
                result = "hot";
            } else if (neighbors9.includes(poisonLocation)) {
                result = "watch out";
            } else {
                result = "warm";
            }

            document.getElementById("help").innerText = "Help report: " + result;
        }

        document.getElementById("helpButton").setAttribute("onclick", "help()");
    </script>
</body>
</html>
